    <script>
      // Gracefully handle benign Vite HMR WebSocket closures in Cloud Run/proxy environments
      (function() {
        var isWsError = function(e) {
          if (!e) return false;
          var msg = (e.message || e.reason?.message || String(e.reason) || String(e) || '').toLowerCase();
          return msg.includes('websocket') || msg.includes('vite') || msg.includes('closed without opened');
        };
        window.addEventListener('error', function(event) {
          if (isWsError(event) || isWsError(event.error)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event) || isWsError(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
