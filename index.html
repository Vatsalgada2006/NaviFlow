    <script>
      // Gracefully handle benign Vite HMR WebSocket closures in Cloud Run/proxy environments
      window.addEventListener('error', function(event) {
        if (event && (event.message?.includes('WebSocket') || event.error?.message?.includes('WebSocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (event.reason.message?.includes('WebSocket') || String(event.reason).includes('WebSocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
